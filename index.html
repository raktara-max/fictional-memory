<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Keuangan</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        background: #f1f5f9;
        color: #0f172a;
    }

    .container {
        max-width: 700px;
        margin: auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
    }

    .saldo {
        background: #2563eb;
        color: white;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 15px;
    }

    .saldo h2 {
        margin: 8px 0 0;
    }

    .ringkasan {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .card {
        background: white;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 2px 8px #0001;
    }

    .masuk {
        color: #16a34a;
    }

    .keluar {
        color: #dc2626;
    }

    form {
        margin-top: 15px;
        background: white;
        padding: 18px;
        border-radius: 12px;
    }

    input, select, button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    .transaksi {
        margin-top: 15px;
    }

    .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: 15px;
        margin-top: 10px;
        border-radius: 10px;
    }

    .hapus {
        width: auto;
        background: #dc2626;
        padding: 8px 12px;
        margin: 0;
    }
</style>
</head>

<body>

<div class="container">

    <h1>💰 Catatan Keuangan</h1>

    <div class="saldo">
        <div>Saldo Saat Ini</div>
        <h2 id="saldo">Rp0</h2>
    </div>

    <div class="ringkasan">
        <div class="card">
            <div>Pemasukan</div>
            <h3 class="masuk" id="pemasukan">Rp0</h3>
        </div>

        <div class="card">
            <div>Pengeluaran</div>
            <h3 class="keluar" id="pengeluaran">Rp0</h3>
        </div>
    </div>

    <form id="form">
        <h3>Tambah Transaksi</h3>

        <input
            type="text"
            id="nama"
            placeholder="Contoh: Beli makan"
            required
        >

        <input
            type="number"
            id="jumlah"
            placeholder="Jumlah uang"
            min="1"
            required
        >

        <select id="jenis">
            <option value="masuk">Pemasukan</option>
            <option value="keluar">Pengeluaran</option>
        </select>

        <button type="submit">+ Tambah Transaksi</button>
    </form>

    <div class="transaksi">
        <h3>Riwayat Transaksi</h3>
        <div id="daftar"></div>
    </div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("keuangan")) || [];

function rupiah(angka) {
    return "Rp" + angka.toLocaleString("id-ID");
}

function simpan() {
    localStorage.setItem("keuangan", JSON.stringify(data));
}

function tampilkan() {

    let pemasukan = 0;
    let pengeluaran = 0;

    data.forEach(item => {
        if (item.jenis === "masuk") {
            pemasukan += item.jumlah;
        } else {
            pengeluaran += item.jumlah;
        }
    });

    let saldo = pemasukan - pengeluaran;

    document.getElementById("pemasukan").textContent = rupiah(pemasukan);
    document.getElementById("pengeluaran").textContent = rupiah(pengeluaran);
    document.getElementById("saldo").textContent = rupiah(saldo);

    const daftar = document.getElementById("daftar");
    daftar.innerHTML = "";

    if (data.length === 0) {
        daftar.innerHTML = "<p>Belum ada transaksi.</p>";
        return;
    }

    data.slice().reverse().forEach((item, index) => {

        const asliIndex = data.length - 1 - index;

        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <div>
                <b>${item.nama}</b><br>
                <span class="${item.jenis}">
                    ${item.jenis === "masuk" ? "+" : "-"}
                    ${rupiah(item.jumlah)}
                </span>
            </div>

            <button class="hapus" onclick="hapus(${asliIndex})">
                Hapus
            </button>
        `;

        daftar.appendChild(div);
    });
}

document.getElementById("form").addEventListener("submit", function(e) {

    e.preventDefault();

    const nama = document.getElementById("nama").value;
    const jumlah = Number(document.getElementById("jumlah").value);
    const jenis = document.getElementById("jenis").value;

    data.push({
        nama: nama,
        jumlah: jumlah,
        jenis: jenis
    });

    simpan();
    tampilkan();

    document.getElementById("form").reset();
});

function hapus(index) {
    data.splice(index, 1);
    simpan();
    tampilkan();
}

tampilkan();
</script>

</body>
</html>
